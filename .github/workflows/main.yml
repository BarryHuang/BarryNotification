name: Seceda Ticket Monitor

on:
  schedule:
    # 每天 UTC 00:00 執行 (剛好對應台灣時間早上 08:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許您在網頁上手動點擊執行測試

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script
        env:
          LINE_CLIENT_ID: ${{ secrets.LINE_CLIENT_ID }}
          LINE_CLIENT_SECRET: ${{ secrets.LINE_CLIENT_SECRET }}
        run: |
          python main.py
