name: Tokyo Disney Hotel Monitor (2027/01/30-02/01)

on:
  schedule:
    # GitHub Actions 排程通常延遲 2~3 小時，設定 UTC 22:00 (台灣 06:00) 補償延遲，
    # 預計台灣 08:00~09:00 收到通知。官網開賣時間是台灣 10:00，來得及準備。
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        type: choice
        options:
          - monitor
          - scan
        default: monitor
      scan_start:
        description: 'scan 模式：起始日 YYYY-MM-DD（留空=今天）'
        type: string
        default: ''
      scan_days:
        description: 'scan 模式：掃描天數'
        type: string
        default: '30'
      scan_nights:
        description: 'scan 模式：每次連住幾晚'
        type: string
        default: '1'
      scan_hotels:
        description: 'scan 模式：飯店代碼（逗號分隔）FSH/DHM/TDH/DAH/TSH/DCH'
        type: string
        default: 'FSH,DHM'

concurrency:
  group: tokyo-disney-hotel
  cancel-in-progress: false

jobs:
  check-booking:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run monitor
        if: ${{ inputs.mode != 'scan' }}
        env:
          LINE_CLIENT_ID: ${{ secrets.LINE_CLIENT_ID }}
          LINE_CLIENT_SECRET: ${{ secrets.LINE_CLIENT_SECRET }}
        run: |
          python tokyo_disney_hotel.py

      # scan 只把結果印在 log，不發 LINE，避免洗版
      - name: Run availability scan
        if: ${{ inputs.mode == 'scan' }}
        run: |
          python tokyo_disney_hotel.py --scan \
            ${{ inputs.scan_start && format('--start {0}', inputs.scan_start) || '' }} \
            --days "${{ inputs.scan_days }}" \
            --nights "${{ inputs.scan_nights }}" \
            --hotels "${{ inputs.scan_hotels }}"
