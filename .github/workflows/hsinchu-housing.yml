name: Hsinchu Housing Report

on:
  schedule:
    # 台灣時間每天約 07:00 起跑（GitHub 排程常延遲 1~2 小時）
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式（probe＝只探測官網下載端點，不產表、不發 LINE）'
        type: choice
        options:
          - report
          - probe
        default: report
      seed:
        description: '重建比對基準（不發 LINE 通知）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hsinchu-housing
  cancel-in-progress: false

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 季別檔在季中不會更新，本期檔的網址官方沒有文件。這一步實地探測，
      # 從 log 讀出哪個端點拿得到最新一期的資料。
      - name: Probe open-data endpoints
        if: ${{ inputs.mode == 'probe' }}
        run: |
          python hsinchu_housing.py --probe

      - name: Build report and notify
        if: ${{ inputs.mode != 'probe' }}
        env:
          LINE_CLIENT_ID: ${{ secrets.LINE_CLIENT_ID }}
          LINE_CLIENT_SECRET: ${{ secrets.LINE_CLIENT_SECRET }}
          SITE_URL: https://barryhuang.github.io/BarryNotification/
        run: |
          python hsinchu_housing.py ${{ inputs.seed && '--seed' || '' }}

      - name: Commit updated report
        if: ${{ inputs.mode != 'probe' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "報表無變動，不需 commit。"
          else
            git commit -m "更新新竹房價報表 $(date -u +'%Y-%m-%d')"
            git push
          fi
